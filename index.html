<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capstone milestones</title>
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#14212b;--mute:#5b6b78;--line:#d9e0e6;--accent:#1d3557;--late:#a51c30;--soon:#9a6412;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a3b0;--line:#2a3945;--accent:#8fb4e8;--late:#f08090;--soon:#e0b050;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font:600 1.7rem/1.2 Georgia,serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0;color:var(--mute);font-size:.9rem}
button,input[type=email]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--card);color:var(--ink)}
button{cursor:pointer}
#auth{display:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0}
#auth p{margin:0 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0}
.item.late{border-left-color:var(--late)}
.item.soon{border-left-color:var(--soon)}
.item.next{outline:2px solid var(--accent)}
.item.done{opacity:.6;border-left-color:var(--ok)}
.row{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.row input{width:22px;height:22px;margin-top:3px;flex:none}
.t{font-weight:600}
.done .t{text-decoration:line-through}
.d{font-size:.9rem;color:var(--mute)}
.late .when{color:var(--late);font-weight:600}
.soon .when{color:var(--soon);font-weight:600}
.item p{margin:6px 0 0}
.a{font-size:.95rem}
a{color:var(--accent)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:.9rem}
textarea{width:100%;min-height:80px;margin-top:6px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Capstone milestones</h1>
<p class="sub" id="sum"></p>
<div class="bar"><i id="bar"></i></div>
<div class="tools">
  <label><input type="checkbox" id="hide"> Hide completed</label>
  <span id="sync"></span>
</div>
<div id="auth">
  <p>Sign in to keep your checklist and notes in sync on your phone and computer.</p>
  <input type="email" id="email" placeholder="you@example.com" aria-label="Email address">
  <button id="login">Email me a sign-in link</button>
  <p class="d" id="msg"></p>
</div>
<div id="list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Paste your Supabase project URL and public (anon/publishable) key to sync across devices.
// Leave both empty to keep everything in this browser only.
const SUPABASE_URL = "";
const SUPABASE_KEY = "";

// id, t = title, d = due date, a = action, x = extra note, r = progress report number
const M = [
 {id:"advisor",t:"Advisor Assignment",d:"2026-08-19",a:"Schedule your first meeting with your Capstone Advisor."},
 {id:"rq",t:"Develop Research Question",d:"2026-08-28",a:"Meet with your advisor and prepare your progress report."},
 {id:"pm1",t:"Progress Meeting 1: Research question and scope",d:"2026-08-28",a:"Develop your research question draft.",x:"Timeline lists Aug 26 as the ideal date."},
 {id:"rqsub",t:"Research Question Submission",d:"2026-09-07",a:"Upload the final research question and progress report to the CRES 719 Canvas course."},
 {id:"intro",t:"Introduction Draft",d:"2026-10-05",a:"Develop the Introduction draft."},
 {id:"meth",t:"Methods Draft",d:"2026-10-26",a:"Develop the methods draft and meet with your advisor."},
 {id:"pm2",t:"Progress Meeting 2: Protocol readiness",d:"2026-11-06",a:"Submit your protocol draft. Send the report to your advisor 24 hours before the meeting.",x:"Report 2 says Nov 6; the timeline lists Nov 13 (ideal Nov 11). Confirm which applies.",r:2},
 {id:"proto",t:"Systematic Review Protocol Submission",d:"2026-11-23",a:"Upload the final protocol and progress report to the CRES 719 Canvas course.",r:2},
 {id:"lit",t:"Literature Review Completion",d:"2026-12-10",a:"Write a preliminary methods draft and meet with your advisor."},
 {id:"pm3",t:"Progress Meeting 3: Evidence synthesis",d:"2027-01-15",a:"Submit Methods and Results. Send the report to your advisor 24 hours before the meeting.",x:"Report 3 says Jan 15; the timeline lists Jan 22 (ideal Jan 20). Confirm which applies.",r:3},
 {id:"draft",t:"First Full Draft Submission",d:"2027-02-08",a:"Upload the first full manuscript draft and progress report to the CRES 719 Canvas course.",r:3},
 {id:"peer",t:"Peer Review",d:"2027-02-22",a:"Complete the peer review and submit written feedback."},
 {id:"pm4",t:"Progress Meeting 4: Final manuscript readiness",d:"2027-03-05",a:"Submit your manuscript draft. Send the report to your advisor 24 hours before the meeting.",x:"Report 4 says Mar 5; the timeline lists Mar 12 (ideal Mar 10). Confirm which applies.",r:4},
 {id:"rev",t:"Revised Manuscript Review",d:"2027-03-08",a:"Write the final manuscript draft and meet with your advisor."},
 {id:"final",t:"Final Capstone Submission",d:"2027-03-22",a:"Upload the final manuscript and progress report to the CRES 719 Canvas course.",r:4},
 {id:"pres",t:"Final Presentations",d:"2027-04-12",a:"Deliver your oral presentation to faculty and peers.",x:"Presentations run Apr 12 to 13."}
];

const K = "capstone-tracker";
const $ = id => document.getElementById(id);
let S = {done:{}, notes:{}};
try { S = {...S, ...JSON.parse(localStorage.getItem(K) || "{}")}; } catch (e) {}

let sb = null, user = null, timer;

function save() {
  try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {}
  if (user) { clearTimeout(timer); timer = setTimeout(push, 800); }
}
async function push() {
  const {error} = await sb.from("tracker").upsert({user_id: user.id, data: S, updated_at: new Date().toISOString()});
  $("sync").textContent = error ? "Sync failed. Changes are saved on this device." : "Synced";
}
async function pull() {
  const {data} = await sb.from("tracker").select("data").maybeSingle();
  if (data && data.data && Object.keys(data.data).length) { S = {done:{}, notes:{}, ...data.data}; try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} }
  else await push();
  render();
}

if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((_e, s) => {
    user = s ? s.user : null;
    $("auth").style.display = user ? "none" : "block";
    $("sync").textContent = user ? "Synced" : "Saved on this device only";
    if (user) pull();
  });
  $("login").onclick = async () => {
    const email = $("email").value.trim();
    if (!email) { $("msg").textContent = "Enter your email address."; return; }
    const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: location.href.split("#")[0]}});
    $("msg").textContent = error ? "Could not send the link: " + error.message : "Check your email and open the link on this device.";
  };
} else {
  $("sync").textContent = "Saved on this device only";
}

const fmt = d => new Date(d + "T00:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"});

function render() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const rows = M.map(m => ({...m, k: Math.round((new Date(m.d + "T00:00") - t0) / 864e5)})).sort((a, b) => a.d < b.d ? -1 : 1);
  const dn = rows.filter(r => S.done[r.id]).length;
  const next = rows.find(r => !S.done[r.id] && r.k >= 0);
  $("sum").textContent = dn + " of " + rows.length + " complete" + (next ? ". Next up: " + next.t + "." : ".");
  $("bar").style.width = (100 * dn / rows.length) + "%";
  const hide = $("hide").checked;
  $("list").innerHTML = rows.filter(r => !(hide && S.done[r.id])).map(r => {
    const done = !!S.done[r.id];
    const cls = done ? "done" : r.k < 0 ? "late" : r.k <= 7 ? "soon" : "";
    const when = r.k < 0 ? (-r.k) + (r.k === -1 ? " day overdue" : " days overdue") : r.k === 0 ? "Due today" : r.k === 1 ? "Due tomorrow" : "In " + r.k + " days";
    return `<div class="item ${cls} ${next && next.id === r.id ? "next" : ""}">
<label class="row"><input type="checkbox" data-id="${r.id}" ${done ? "checked" : ""}>
<span><span class="t">${r.t}</span><br><span class="d">${fmt(r.d)}</span><br><span class="d when">${done ? "Done" : when}</span></span></label>
<p class="a">${r.a}</p>
${r.x ? `<p class="d">${r.x}</p>` : ""}
${r.r ? `<p><a href="reports/progress-report-${r.r}.pdf" target="_blank" rel="noopener">Open Progress Report ${r.r} (PDF)</a></p>` : ""}
<details ${S.notes[r.id] ? "open" : ""}><summary>Notes</summary><textarea data-note="${r.id}" aria-label="Notes for ${r.t}"></textarea></details>
</div>`;
  }).join("");
  document.querySelectorAll("textarea").forEach(e => e.value = S.notes[e.dataset.note] || "");
}

$("list").onchange = e => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.checked) S.done[id] = true; else delete S.done[id];
  save(); render();
};
$("list").oninput = e => {
  const id = e.target.dataset.note;
  if (!id) return;
  S.notes[id] = e.target.value;
  save();
};
$("hide").onchange = render;
render();
</script>
</body>
</html>
